<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Значение для современной школы"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ПРАКТИКА</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Значение для современной школы</text><text x="72" y="162" font-size="21" fill="#6C757D">Что школа берёт у Адлера и у Юнга</text><rect x="77" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="72" y="196" width="552" height="10" rx="5" fill="#0D6EFD"/><text x="104" y="254" font-size="25" fill="#0A58CA" font-weight="700">От Адлера</text><circle cx="109" cy="305" r="5" fill="#0D6EFD"/><text x="130" y="312" font-size="20" fill="#343A40">«трудное» поведение — сигнал, а не характер;</text><circle cx="109" cy="361" r="5" fill="#0D6EFD"/><text x="130" y="368" font-size="20" fill="#343A40">поддержка и поощрение вместо наказания;</text><circle cx="109" cy="417" r="5" fill="#0D6EFD"/><text x="130" y="424" font-size="20" fill="#343A40">развитие сотрудничества и самоуправления;</text><circle cx="109" cy="473" r="5" fill="#0D6EFD"/><text x="130" y="480" font-size="20" fill="#343A40">внимание к самооценке и мотивации.</text><rect x="661" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="656" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="656" y="196" width="552" height="10" rx="5" fill="#0F766E"/><text x="688" y="254" font-size="25" fill="#0F766E" font-weight="700">От Юнга</text><circle cx="693" cy="305" r="5" fill="#0F766E"/><text x="714" y="312" font-size="20" fill="#343A40">учёт индивидуальных стилей обучения;</text><circle cx="693" cy="361" r="5" fill="#0F766E"/><text x="714" y="368" font-size="20" fill="#343A40">ценность творчества, сказки и игры;</text><circle cx="693" cy="417" r="5" fill="#0F766E"/><text x="714" y="424" font-size="20" fill="#343A40">работа с символами и внутренним миром;</text><circle cx="693" cy="473" r="5" fill="#0F766E"/><text x="714" y="480" font-size="20" fill="#343A40">внимание к личности учителя.</text><rect x="77" y="618" width="1136" height="68" rx="18" fill="#E9EEF3"/><rect x="72" y="612" width="1136" height="68" rx="18" fill="#F8F9FA" stroke="#F8F9FA" stroke-width="1.5"/><text x="104" y="656" font-size="21" fill="#212529" font-weight="600">Двойная опора учителя: понимание отношений и понимание внутреннего мира ребёнка.</text></svg>
