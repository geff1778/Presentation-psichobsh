<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Юнг: психологические типы и обучение"><rect x="0" y="0" width="1280" height="7" fill="#0F766E"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 2 · ЮНГ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Юнг: психологические типы и обучение</text><text x="72" y="162" font-size="21" fill="#6C757D">Экстраверсия и интроверсия · четыре функции</text><rect x="77" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="248" font-size="24" fill="#212529" font-weight="700">Две установки</text><rect x="104" y="288" width="163" height="42" rx="21" fill="#E4F3F0"/><text x="122" y="317" font-size="19" fill="#0F766E" font-weight="600">Экстраверсия</text><text x="104" y="372" font-size="20" fill="#343A40"><tspan x="104" dy="0">Энергия направлена вовне.</tspan><tspan x="104" dy="32">Учится через общение, движение,</tspan><tspan x="104" dy="32">обсуждение и совместную работу.</tspan></text><rect x="104" y="470" width="153" height="42" rx="21" fill="#E7F1FF"/><text x="122" y="499" font-size="19" fill="#0A58CA" font-weight="600">Интроверсия</text><text x="104" y="552" font-size="20" fill="#343A40"><tspan x="104" dy="0">Энергия направлена внутрь.</tspan><tspan x="104" dy="32">Учится через размышление и паузу.</tspan></text><rect x="661" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="656" y="196" width="552" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="688" y="248" font-size="24" fill="#212529" font-weight="700">Четыре функции</text><circle cx="700" cy="294" r="7" fill="#0D6EFD"/><text x="724" y="300" font-size="21" fill="#212529" font-weight="700">Мышление</text><text x="724" y="328" font-size="19" fill="#6C757D">логика, структура, правила</text><circle cx="700" cy="366" r="7" fill="#0F766E"/><text x="724" y="372" font-size="21" fill="#212529" font-weight="700">Чувство</text><text x="724" y="400" font-size="19" fill="#6C757D">принятие, личное отношение</text><circle cx="700" cy="438" r="7" fill="#0D6EFD"/><text x="724" y="444" font-size="21" fill="#212529" font-weight="700">Ощущение</text><text x="724" y="472" font-size="19" fill="#6C757D">наглядность, практика</text><circle cx="700" cy="510" r="7" fill="#0F766E"/><text x="724" y="516" font-size="21" fill="#212529" font-weight="700">Интуиция</text><text x="724" y="544" font-size="19" fill="#6C757D">смысл, догадка, перспектива</text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Вывод: единый метод обучения не годится для всех — отсюда идея стилей обучения.</text></svg>
