<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Адлер: социальный интерес и школьная практика"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 1 · АДЛЕР</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Адлер: социальный интерес и школа</text><text x="72" y="162" font-size="21" fill="#6C757D">Gemeinschaftsgefühl — чувство общности</text><rect x="77" y="202" width="500" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="500" height="396" rx="18" fill="#E7F1FF" stroke="#E7F1FF" stroke-width="1.5"/><text x="104" y="252" font-size="25" fill="#0A58CA" font-weight="700">Социальный интерес</text><text x="104" y="300" font-size="21" fill="#212529"><tspan x="104" dy="0">Врождённая склонность быть частью</tspan><tspan x="104" dy="34">сообщества, сотрудничать и вносить</tspan><tspan x="104" dy="34">вклад в общее дело.</tspan></text><line x1="104" y1="418" x2="540" y2="418" stroke="#0D6EFD" stroke-width="2"/><text x="104" y="458" font-size="20" fill="#6C757D">Критерий психического здоровья:</text><text x="104" y="496" font-size="22" fill="#0A58CA" font-weight="600">связь с людьми, а не превосходство.</text><text x="104" y="552" font-size="20" fill="#6C757D">Задача школы — воспитывать</text><text x="104" y="582" font-size="22" fill="#212529" font-weight="600">сотрудничество, а не соперничество.</text><rect x="617" y="202" width="596" height="396" rx="18" fill="#E9EEF3"/><rect x="612" y="196" width="596" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="644" y="252" font-size="25" fill="#212529" font-weight="700">Школьная практика Адлера</text><circle cx="656" cy="300" r="7" fill="#0D6EFD"/><text x="680" y="306" font-size="21" fill="#0A58CA" font-weight="700">1919–1920-е</text><text x="680" y="334" font-size="19" fill="#6C757D"><tspan x="680" dy="0">Венские медико-педагогические консультации:</tspan><tspan x="680" dy="26">учитель + врач + психолог</tspan></text><circle cx="656" cy="400" r="7" fill="#0D6EFD"/><text x="680" y="406" font-size="21" fill="#0A58CA" font-weight="700">Экспериментальная школа</text><text x="680" y="434" font-size="19" fill="#6C757D"><tspan x="680" dy="0">без наказаний, с самоуправлением</tspan><tspan x="680" dy="26">и общими делами</tspan></text><circle cx="656" cy="500" r="7" fill="#0D6EFD"/><text x="680" y="506" font-size="21" fill="#0A58CA" font-weight="700">Сегодня</text><text x="680" y="534" font-size="19" fill="#6C757D"><tspan x="680" dy="0">поддержка вместо наказания;</tspan><tspan x="680" dy="26">«трудное» поведение — сигнал</tspan></text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Адлер: школа должна дать ребёнку переживание нужности и принадлежности.</text></svg>
