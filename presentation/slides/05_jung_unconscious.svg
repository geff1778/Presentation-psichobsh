<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Юнг: коллективное бессознательное и архетипы"><rect x="0" y="0" width="1280" height="7" fill="#0F766E"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 2 · ЮНГ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Юнг: коллективное бессознательное</text><text x="72" y="162" font-size="21" fill="#6C757D">Архетипы как универсальные первообразы</text><rect x="77" y="202" width="520" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="520" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="248" font-size="24" fill="#212529" font-weight="700">Структура психики</text><rect x="104" y="292" width="456" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="132" y="341" font-size="21" fill="#212529" font-weight="600">Сознание</text><rect x="104" y="384" width="456" height="78" rx="12" fill="#E4F3F0" stroke="#E4F3F0" stroke-width="1.5"/><text x="132" y="433" font-size="21" fill="#0F766E" font-weight="600">Личное бессознательное</text><rect x="104" y="476" width="456" height="78" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="1.5"/><text x="132" y="525" font-size="21" fill="#FFFFFF" font-weight="700">Коллективное бессознательное</text><text x="104" y="572" font-size="19" fill="#6C757D">Слой, общий для всех людей,</text><text x="104" y="596" font-size="19" fill="#6C757D">наследуется как структура опыта.</text><rect x="629" y="202" width="584" height="396" rx="18" fill="#E9EEF3"/><rect x="624" y="196" width="584" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="656" y="248" font-size="24" fill="#212529" font-weight="700">Архетипы — «пустые формы»</text><text x="656" y="286" font-size="19" fill="#6C757D">наполняются личным опытом ребёнка</text><rect x="656" y="330" width="78" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="359" font-size="19" fill="#0F766E" font-weight="600">Тень</text><rect x="924" y="330" width="110" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="359" font-size="19" fill="#0F766E" font-weight="600">Персона</text><rect x="656" y="396" width="110" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="425" font-size="19" fill="#0F766E" font-weight="600">Самость</text><rect x="924" y="396" width="99" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="425" font-size="19" fill="#0F766E" font-weight="600">Мудрец</text><rect x="656" y="462" width="163" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="491" font-size="19" fill="#0F766E" font-weight="600">Великая Мать</text><rect x="924" y="462" width="184" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="491" font-size="19" fill="#0F766E" font-weight="600">Анима / Анимус</text><line x1="656" y1="524" x2="1176" y2="524" stroke="#E2E8F0" stroke-width="2"/><text x="656" y="560" font-size="19" fill="#343A40"><tspan x="656" dy="0">Сказка, миф, игра, любимый герой —</tspan><tspan x="656" dy="30">встреча ребёнка с общечеловеческими образами.</tspan></text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Отсюда — ценность творчества и работы с символами в детском возрасте.</text></svg>
