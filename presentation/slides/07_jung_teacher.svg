<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Юнг: учитель как архетип и индивидуация"><rect x="0" y="0" width="1280" height="7" fill="#0F766E"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 2 · ЮНГ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Юнг: учитель как архетип и индивидуация</text><text x="72" y="162" font-size="21" fill="#6C757D">Личность учителя и цель развития ребёнка</text><rect x="77" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="248" font-size="24" fill="#212529" font-weight="700">Учитель как архетип</text><rect x="104" y="288" width="99" height="42" rx="21" fill="#E4F3F0"/><text x="122" y="317" font-size="19" fill="#0F766E" font-weight="600">Мудрец</text><text x="240" y="314" font-size="19" fill="#6C757D">— носитель знания</text><rect x="104" y="344" width="99" height="42" rx="21" fill="#E7F1FF"/><text x="122" y="373" font-size="19" fill="#0A58CA" font-weight="600">Мастер</text><text x="240" y="370" font-size="19" fill="#6C757D">— носитель умения</text><line x1="104" y1="416" x2="592" y2="416" stroke="#E2E8F0" stroke-width="2"/><circle cx="109" cy="453" r="5" fill="#0F766E"/><text x="130" y="460" font-size="19" fill="#343A40">на учителя проецируются ожидания и страхи;</text><circle cx="109" cy="493" r="5" fill="#0F766E"/><text x="130" y="500" font-size="19" fill="#343A40">влияет прежде всего личностью, не словами;</text><circle cx="109" cy="533" r="5" fill="#0F766E"/><text x="130" y="540" font-size="19" fill="#343A40">самопознание учителя — часть работы.</text><rect x="661" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="656" y="196" width="552" height="396" rx="18" fill="#E4F3F0" stroke="#E4F3F0" stroke-width="1.5"/><text x="688" y="248" font-size="24" fill="#0F766E" font-weight="700">Индивидуация</text><text x="688" y="296" font-size="21" fill="#212529"><tspan x="688" dy="0">Цель развития — стать самим собой</tspan><tspan x="688" dy="34">и обрести внутреннюю целостность.</tspan></text><line x1="688" y1="378" x2="1176" y2="378" stroke="#0F766E" stroke-width="2"/><text x="688" y="416" font-size="20" fill="#343A40">Включает признание Тени —</text><text x="688" y="446" font-size="20" fill="#343A40">своих непризнанных качеств.</text><text x="688" y="512" font-size="20" fill="#6C757D">Цель школы — помочь каждому</text><text x="688" y="542" font-size="20" fill="#6C757D">раскрыть собственную</text><text x="688" y="572" font-size="22" fill="#0F766E" font-weight="700">неповторимость.</text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Юнг: учитель влияет не тем, что говорит, а тем, кем он является.</text></svg>
