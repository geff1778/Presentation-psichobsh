<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Общее и различное"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 3 · СРАВНЕНИЕ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Общее и различное</text><text x="72" y="162" font-size="21" fill="#6C757D">Адлер и Юнг: сопоставление</text><rect x="77" y="190" width="1136" height="104" rx="18" fill="#E9EEF3"/><rect x="72" y="184" width="1136" height="104" rx="18" fill="#E7F1FF" stroke="#E7F1FF" stroke-width="1.5"/><text x="104" y="224" font-size="21" fill="#0A58CA" font-weight="700">Общее:</text><text x="230" y="216" font-size="19" fill="#343A40"><tspan x="230" dy="0">критика авторитарной школы · интерес к бессознательному ·</tspan><tspan x="230" dy="28">связь психологии и педагогики · уважение к ребёнку</tspan></text><rect x="77" y="306" width="1136" height="300" rx="14" fill="#E9EEF3"/><rect x="72" y="300" width="1136" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="72" y="300" width="1136" height="52" rx="14" fill="#F1F5F9"/><rect x="72" y="322" width="1136" height="30" fill="#F1F5F9"/><text x="96" y="334" font-size="19" fill="#6C757D" font-weight="700">Критерий</text><text x="356" y="334" font-size="20" fill="#0A58CA" font-weight="700">АДЛЕР</text><text x="794" y="334" font-size="20" fill="#0F766E" font-weight="700">ЮНГ</text><text x="96" y="384" font-size="19" fill="#343A40" font-weight="600">Движущая сила</text><text x="356" y="384" font-size="19" fill="#343A40">неполноценность и компенсация</text><text x="794" y="384" font-size="19" fill="#343A40">архетипы и индивидуация</text><line x1="92" y1="401" x2="1188" y2="401" stroke="#E2E8F0" stroke-width="1"/><rect x="72" y="401" width="1136" height="49" fill="#F8F9FA"/><text x="96" y="433" font-size="19" fill="#343A40" font-weight="600">Ключевое понятие</text><text x="356" y="433" font-size="19" fill="#343A40">социальный интерес</text><text x="794" y="433" font-size="19" fill="#343A40">коллективное бессознательное</text><line x1="92" y1="450" x2="1188" y2="450" stroke="#E2E8F0" stroke-width="1"/><text x="96" y="482" font-size="19" fill="#343A40" font-weight="600">Критерий здоровья</text><text x="356" y="482" font-size="19" fill="#343A40">сотрудничество, вклад</text><text x="794" y="482" font-size="19" fill="#343A40">целостность, согласие с собой</text><line x1="92" y1="499" x2="1188" y2="499" stroke="#E2E8F0" stroke-width="1"/><rect x="72" y="499" width="1136" height="49" fill="#F8F9FA"/><text x="96" y="531" font-size="19" fill="#343A40" font-weight="600">Роль учителя</text><text x="356" y="531" font-size="19" fill="#343A40">партнёр и помощник</text><text x="794" y="531" font-size="19" fill="#343A40">носитель архетипа, пример</text><line x1="92" y1="548" x2="1188" y2="548" stroke="#E2E8F0" stroke-width="1"/><text x="96" y="580" font-size="19" fill="#343A40" font-weight="600">Цель школы</text><text x="356" y="580" font-size="19" fill="#343A40">стать успешным вместе с другими</text><text x="794" y="580" font-size="19" fill="#343A40">стать самим собой</text><line x1="332" y1="300" x2="332" y2="600" stroke="#E2E8F0" stroke-width="2"/><line x1="770" y1="300" x2="770" y2="600" stroke="#E2E8F0" stroke-width="2"/><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Адлер: «стать успешным вместе с другими» · Юнг: «стать самим собой»</text></svg>
