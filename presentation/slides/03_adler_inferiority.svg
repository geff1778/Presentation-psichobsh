<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Адлер: чувство неполноценности и компенсация"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 1 · АДЛЕР</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Адлер: чувство неполноценности</text><text x="72" y="162" font-size="21" fill="#6C757D">Компенсация как источник развития</text><rect x="77" y="202" width="1136" height="116" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="1136" height="116" rx="18" fill="#E7F1FF" stroke="#E7F1FF" stroke-width="1.5"/><rect x="72" y="196" width="8" height="116" rx="4" fill="#0D6EFD"/><text x="104" y="238" font-size="23" fill="#212529" font-weight="600"><tspan x="104" dy="0">Чувство неполноценности — нормальное переживание каждого</tspan><tspan x="104" dy="34">ребёнка: он мал, слаб и зависим от взрослых.</tspan></text><text x="104" y="300" font-size="21" fill="#0A58CA" font-weight="600">Это не болезнь, а стимул к развитию.</text><rect x="77" y="350" width="552" height="250" rx="18" fill="#E9EEF3"/><rect x="72" y="344" width="552" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="72" y="344" width="552" height="10" rx="5" fill="#0F766E"/><text x="104" y="400" font-size="23" fill="#0F766E" font-weight="700">Конструктивная компенсация</text><circle cx="109" cy="441" r="5" fill="#0F766E"/><text x="130" y="448" font-size="20" fill="#343A40">преодоление трудности, рост усилий;</text><circle cx="109" cy="483" r="5" fill="#0F766E"/><text x="130" y="490" font-size="20" fill="#343A40">поиск другой области успеха;</text><circle cx="109" cy="525" r="5" fill="#0F766E"/><text x="130" y="532" font-size="20" fill="#343A40">уверенность и вклад в общее дело.</text><rect x="661" y="350" width="552" height="250" rx="18" fill="#E9EEF3"/><rect x="656" y="344" width="552" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="656" y="344" width="552" height="10" rx="5" fill="#B45309"/><text x="688" y="400" font-size="23" fill="#B45309" font-weight="700">Деструктивная компенсация</text><circle cx="693" cy="441" r="5" fill="#B45309"/><text x="714" y="448" font-size="20" fill="#343A40">агрессия, демонстративность, обман;</text><circle cx="693" cy="483" r="5" fill="#B45309"/><text x="714" y="490" font-size="20" fill="#343A40">лень как защита: «способный, просто ленится»;</text><circle cx="693" cy="525" r="5" fill="#B45309"/><text x="714" y="532" font-size="20" fill="#343A40">уход в болезнь, отказ от деятельности.</text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Для учителя: сравнение и унижение толкают ребёнка к деструктивной компенсации.</text></svg>
