<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Почему школа стала объектом психологии"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">КОНТЕКСТ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Почему школа стала объектом психологии</text><text x="72" y="162" font-size="21" fill="#6C757D">Начало XX века: массовая школа, детство и бессознательное</text><rect x="77" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="252" font-size="25" fill="#212529" font-weight="700">Школа в центре внимания</text><circle cx="109" cy="301" r="5" fill="#0D6EFD"/><text x="130" y="308" font-size="20" fill="#343A40">Массовая школа и обязательное обучение —</text><circle cx="109" cy="339" r="5" fill="#0D6EFD"/><text x="130" y="346" font-size="20" fill="#343A40">огромный поток детей впервые рядом друг с другом.</text><circle cx="109" cy="377" r="5" fill="#0D6EFD"/><text x="130" y="384" font-size="20" fill="#343A40">Школа — первый институт после семьи, где</text><circle cx="109" cy="415" r="5" fill="#0D6EFD"/><text x="130" y="422" font-size="20" fill="#343A40">ребёнок переживает успех и неудачу.</text><circle cx="109" cy="453" r="5" fill="#0D6EFD"/><text x="130" y="460" font-size="20" fill="#343A40">Психоанализ выходит за пределы клиники:</text><circle cx="109" cy="491" r="5" fill="#0D6EFD"/><text x="130" y="498" font-size="20" fill="#343A40">возникает интерес к детству и обучению.</text><rect x="669" y="202" width="544" height="396" rx="18" fill="#E9EEF3"/><rect x="664" y="196" width="544" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="696" y="252" font-size="25" fill="#212529" font-weight="700">Ключевые вехи</text><line x1="738" y1="312" x2="738" y2="548" stroke="#E2E8F0" stroke-width="3"/><circle cx="738" cy="316" r="11" fill="#0D6EFD"/><text x="774" y="314" font-size="21" fill="#0D6EFD" font-weight="700">1900-е</text><text x="774" y="340" font-size="18" fill="#6C757D">Массовая школа в Европе</text><circle cx="738" cy="388" r="11" fill="#0F766E"/><text x="774" y="386" font-size="21" fill="#0F766E" font-weight="700">1911</text><text x="774" y="412" font-size="18" fill="#6C757D">А. Адлер создаёт индивидуальную психологию</text><circle cx="738" cy="460" r="11" fill="#0F766E"/><text x="774" y="458" font-size="21" fill="#0F766E" font-weight="700">1913</text><text x="774" y="484" font-size="18" fill="#6C757D">К. Г. Юнг: аналитическая психология</text><circle cx="738" cy="532" r="11" fill="#0D6EFD"/><text x="774" y="530" font-size="21" fill="#0D6EFD" font-weight="700">1919–20</text><text x="774" y="556" font-size="18" fill="#6C757D">Венские медико-педагогические консультации</text><text x="72" y="656" font-size="21" fill="#343A40" font-weight="600">Вывод: школа становится пространством, где формируется личность ребёнка.</text></svg>
