<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Выводы и источники"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ИТОГИ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Выводы и источники</text><text x="72" y="162" font-size="21" fill="#6C757D">Итоги доклада</text><rect x="77" y="202" width="660" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="660" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="250" font-size="25" fill="#212529" font-weight="700">Выводы</text><circle cx="109" cy="299" r="5" fill="#0D6EFD"/><text x="130" y="306" font-size="20" fill="#343A40">Адлер: школа через отношения —</text><circle cx="109" cy="343" r="5" fill="#0D6EFD"/><text x="130" y="350" font-size="20" fill="#343A40">неполноценность, компенсация, социальный интерес.</text><circle cx="109" cy="387" r="5" fill="#0D6EFD"/><text x="130" y="394" font-size="20" fill="#343A40">Юнг: школа через внутренний мир —</text><circle cx="109" cy="431" r="5" fill="#0D6EFD"/><text x="130" y="438" font-size="20" fill="#343A40">архетипы, психологические типы, индивидуация.</text><circle cx="109" cy="475" r="5" fill="#0D6EFD"/><text x="130" y="482" font-size="20" fill="#343A40">Подходы не противоречат, а дополняют друг друга:</text><circle cx="109" cy="519" r="5" fill="#0D6EFD"/><text x="130" y="526" font-size="20" fill="#343A40">успех вместе с другими и верность себе.</text><rect x="761" y="202" width="452" height="396" rx="18" fill="#E9EEF3"/><rect x="756" y="196" width="452" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="788" y="250" font-size="25" fill="#212529" font-weight="700">Источники</text><circle cx="800" cy="300" r="4" fill="#0D6EFD"/><text x="820" y="306" font-size="18" fill="#343A40">1. Д. А. Леонтьев. Адлер Альфред (БРЭ)</text><circle cx="800" cy="338" r="4" fill="#0D6EFD"/><text x="820" y="344" font-size="18" fill="#343A40">2. Леонтьев. Индивидуальная психология</text><circle cx="800" cy="376" r="4" fill="#0D6EFD"/><text x="820" y="382" font-size="18" fill="#343A40">3. Мавлявиева. Дис. о концепции Адлера</text><circle cx="800" cy="414" r="4" fill="#0D6EFD"/><text x="820" y="420" font-size="18" fill="#343A40">4. К. Г. Юнг (Психологический словарь)</text><circle cx="800" cy="452" r="4" fill="#0D6EFD"/><text x="820" y="458" font-size="18" fill="#343A40">5. Л. Хьелл, Д. Зиглер. Теории личности</text><circle cx="800" cy="490" r="4" fill="#0D6EFD"/><text x="820" y="496" font-size="18" fill="#343A40">6. Модель Юнга и стили обучения</text><circle cx="800" cy="528" r="4" fill="#0D6EFD"/><text x="820" y="534" font-size="18" fill="#343A40">7. Архетипическая педагогика</text><text x="72" y="654" font-size="24" fill="#0A58CA" font-weight="700">Спасибо за внимание!</text></svg>
