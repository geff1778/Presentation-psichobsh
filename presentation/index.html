<div class="slide" data-name="02_why" aria-label="Почему школа стала объектом психологии"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Почему школа стала объектом психологии"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">КОНТЕКСТ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Почему школа стала объектом психологии</text><text x="72" y="162" font-size="21" fill="#6C757D">Начало XX века: массовая школа, детство и бессознательное</text><rect x="77" y="202" width="552" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="552" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="252" font-size="25" fill="#212529" font-weight="700">Школа в центре внимания</text><circle cx="109" cy="301" r="5" fill="#0D6EFD"/><text x="130" y="308" font-size="20" fill="#343A40">Массовая школа и обязательное обучение —</text><circle cx="109" cy="339" r="5" fill="#0D6EFD"/><text x="130" y="346" font-size="20" fill="#343A40">огромный поток детей впервые рядом друг с другом.</text><circle cx="109" cy="377" r="5" fill="#0D6EFD"/><text x="130" y="384" font-size="20" fill="#343A40">Школа — первый институт после семьи, где</text><circle cx="109" cy="415" r="5" fill="#0D6EFD"/><text x="130" y="422" font-size="20" fill="#343A40">ребёнок переживает успех и неудачу.</text><circle cx="109" cy="453" r="5" fill="#0D6EFD"/><text x="130" y="460" font-size="20" fill="#343A40">Психоанализ выходит за пределы клиники:</text><circle cx="109" cy="491" r="5" fill="#0D6EFD"/><text x="130" y="498" font-size="20" fill="#343A40">возникает интерес к детству и обучению.</text><rect x="669" y="202" width="544" height="396" rx="18" fill="#E9EEF3"/><rect x="664" y="196" width="544" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="696" y="252" font-size="25" fill="#212529" font-weight="700">Ключевые вехи</text><line x1="738" y1="312" x2="738" y2="548" stroke="#E2E8F0" stroke-width="3"/><circle cx="738" cy="316" r="11" fill="#0D6EFD"/><text x="774" y="314" font-size="21" fill="#0D6EFD" font-weight="700">1900-е</text><text x="774" y="340" font-size="18" fill="#6C757D">Массовая школа в Европе</text><circle cx="738" cy="388" r="11" fill="#0F766E"/><text x="774" y="386" font-size="21" fill="#0F766E" font-weight="700">1911</text><text x="774" y="412" font-size="18" fill="#6C757D">А. Адлер создаёт индивидуальную психологию</text><circle cx="738" cy="460" r="11" fill="#0F766E"/><text x="774" y="458" font-size="21" fill="#0F766E" font-weight="700">1913</text><text x="774" y="484" font-size="18" fill="#6C757D">К. Г. Юнг: аналитическая психология</text><circle cx="738" cy="532" r="11" fill="#0D6EFD"/><text x="774" y="530" font-size="21" fill="#0D6EFD" font-weight="700">1919–20</text><text x="774" y="556" font-size="18" fill="#6C757D">Венские медико-педагогические консультации</text><text x="72" y="656" font-size="21" fill="#343A40" font-weight="600">Вывод: школа становится пространством, где формируется личность ребёнка.</text></svg></div>
<div class="slide" data-name="03_adler_inferiority" aria-label="Адлер: чувство неполноценности и компенсация"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Адлер: чувство неполноценности и компенсация"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 1 · АДЛЕР</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Адлер: чувство неполноценности</text><text x="72" y="162" font-size="21" fill="#6C757D">Компенсация как источник развития</text><rect x="77" y="202" width="1136" height="116" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="1136" height="116" rx="18" fill="#E7F1FF" stroke="#E7F1FF" stroke-width="1.5"/><rect x="72" y="196" width="8" height="116" rx="4" fill="#0D6EFD"/><text x="104" y="238" font-size="23" fill="#212529" font-weight="600"><tspan x="104" dy="0">Чувство неполноценности — нормальное переживание каждого</tspan><tspan x="104" dy="34">ребёнка: он мал, слаб и зависим от взрослых.</tspan></text><text x="104" y="300" font-size="21" fill="#0A58CA" font-weight="600">Это не болезнь, а стимул к развитию.</text><rect x="77" y="350" width="552" height="250" rx="18" fill="#E9EEF3"/><rect x="72" y="344" width="552" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="72" y="344" width="552" height="10" rx="5" fill="#0F766E"/><text x="104" y="400" font-size="23" fill="#0F766E" font-weight="700">Конструктивная компенсация</text><circle cx="109" cy="441" r="5" fill="#0F766E"/><text x="130" y="448" font-size="20" fill="#343A40">преодоление трудности, рост усилий;</text><circle cx="109" cy="483" r="5" fill="#0F766E"/><text x="130" y="490" font-size="20" fill="#343A40">поиск другой области успеха;</text><circle cx="109" cy="525" r="5" fill="#0F766E"/><text x="130" y="532" font-size="20" fill="#343A40">уверенность и вклад в общее дело.</text><rect x="661" y="350" width="552" height="250" rx="18" fill="#E9EEF3"/><rect x="656" y="344" width="552" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="656" y="344" width="552" height="10" rx="5" fill="#B45309"/><text x="688" y="400" font-size="23" fill="#B45309" font-weight="700">Деструктивная компенсация</text><circle cx="693" cy="441" r="5" fill="#B45309"/><text x="714" y="448" font-size="20" fill="#343A40">агрессия, демонстративность, обман;</text><circle cx="693" cy="483" r="5" fill="#B45309"/><text x="714" y="490" font-size="20" fill="#343A40">лень как защита: «способный, просто ленится»;</text><circle cx="693" cy="525" r="5" fill="#B45309"/><text x="714" y="532" font-size="20" fill="#343A40">уход в болезнь, отказ от деятельности.</text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Для учителя: сравнение и унижение толкают ребёнка к деструктивной компенсации.</text></svg></div>
<div class="slide" data-name="04_adler_social" aria-label="Адлер: социальный интерес и школьная практика"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Адлер: социальный интерес и школьная практика"><rect x="0" y="0" width="1280" height="7" fill="#0D6EFD"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 1 · АДЛЕР</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Адлер: социальный интерес и школа</text><text x="72" y="162" font-size="21" fill="#6C757D">Gemeinschaftsgefühl — чувство общности</text><rect x="77" y="202" width="500" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="500" height="396" rx="18" fill="#E7F1FF" stroke="#E7F1FF" stroke-width="1.5"/><text x="104" y="252" font-size="25" fill="#0A58CA" font-weight="700">Социальный интерес</text><text x="104" y="300" font-size="21" fill="#212529"><tspan x="104" dy="0">Врождённая склонность быть частью</tspan><tspan x="104" dy="34">сообщества, сотрудничать и вносить</tspan><tspan x="104" dy="34">вклад в общее дело.</tspan></text><line x1="104" y1="418" x2="540" y2="418" stroke="#0D6EFD" stroke-width="2"/><text x="104" y="458" font-size="20" fill="#6C757D">Критерий психического здоровья:</text><text x="104" y="496" font-size="22" fill="#0A58CA" font-weight="600">связь с людьми, а не превосходство.</text><text x="104" y="552" font-size="20" fill="#6C757D">Задача школы — воспитывать</text><text x="104" y="582" font-size="22" fill="#212529" font-weight="600">сотрудничество, а не соперничество.</text><rect x="617" y="202" width="596" height="396" rx="18" fill="#E9EEF3"/><rect x="612" y="196" width="596" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="644" y="252" font-size="25" fill="#212529" font-weight="700">Школьная практика Адлера</text><circle cx="656" cy="300" r="7" fill="#0D6EFD"/><text x="680" y="306" font-size="21" fill="#0A58CA" font-weight="700">1919–1920-е</text><text x="680" y="334" font-size="19" fill="#6C757D"><tspan x="680" dy="0">Венские медико-педагогические консультации:</tspan><tspan x="680" dy="26">учитель + врач + психолог</tspan></text><circle cx="656" cy="400" r="7" fill="#0D6EFD"/><text x="680" y="406" font-size="21" fill="#0A58CA" font-weight="700">Экспериментальная школа</text><text x="680" y="434" font-size="19" fill="#6C757D"><tspan x="680" dy="0">без наказаний, с самоуправлением</tspan><tspan x="680" dy="26">и общими делами</tspan></text><circle cx="656" cy="500" r="7" fill="#0D6EFD"/><text x="680" y="506" font-size="21" fill="#0A58CA" font-weight="700">Сегодня</text><text x="680" y="534" font-size="19" fill="#6C757D"><tspan x="680" dy="0">поддержка вместо наказания;</tspan><tspan x="680" dy="26">«трудное» поведение — сигнал</tspan></text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Адлер: школа должна дать ребёнку переживание нужности и принадлежности.</text></svg></div>
<div class="slide" data-name="05_jung_unconscious" aria-label="Юнг: коллективное бессознательное и архетипы"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" lang="ru-RU" role="img" aria-label="Юнг: коллективное бессознательное и архетипы"><rect x="0" y="0" width="1280" height="7" fill="#0F766E"/><text x="72" y="62" font-size="17" fill="#6C757D" font-weight="600" letter-spacing="1.5">ГЛАВА 2 · ЮНГ</text><text x="72" y="118" font-size="40" fill="#212529" font-weight="700">Юнг: коллективное бессознательное</text><text x="72" y="162" font-size="21" fill="#6C757D">Архетипы как универсальные первообразы</text><rect x="77" y="202" width="520" height="396" rx="18" fill="#E9EEF3"/><rect x="72" y="196" width="520" height="396" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="104" y="248" font-size="24" fill="#212529" font-weight="700">Структура психики</text><rect x="104" y="292" width="456" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><text x="132" y="341" font-size="21" fill="#212529" font-weight="600">Сознание</text><rect x="104" y="384" width="456" height="78" rx="12" fill="#E4F3F0" stroke="#E4F3F0" stroke-width="1.5"/><text x="132" y="433" font-size="21" fill="#0F766E" font-weight="600">Личное бессознательное</text><rect x="104" y="476" width="456" height="78" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="1.5"/><text x="132" y="525" font-size="21" fill="#FFFFFF" font-weight="700">Коллективное бессознательное</text><text x="104" y="572" font-size="19" fill="#6C757D">Слой, общий для всех людей,</text><text x="104" y="596" font-size="19" fill="#6C757D">наследуется как структура опыта.</text><rect x="629" y="202" width="584" height="396" rx="18" fill="#E9EEF3"/><rect x="624" y="196" width="584" height="396" rx="18" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1.5"/><text x="656" y="248" font-size="24" fill="#212529" font-weight="700">Архетипы — «пустые формы»</text><text x="656" y="286" font-size="19" fill="#6C757D">наполняются личным опытом ребёнка</text><rect x="656" y="330" width="78" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="359" font-size="19" fill="#0F766E" font-weight="600">Тень</text><rect x="924" y="330" width="110" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="359" font-size="19" fill="#0F766E" font-weight="600">Персона</text><rect x="656" y="396" width="110" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="425" font-size="19" fill="#0F766E" font-weight="600">Самость</text><rect x="924" y="396" width="99" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="425" font-size="19" fill="#0F766E" font-weight="600">Мудрец</text><rect x="656" y="462" width="163" height="42" rx="21" fill="#E4F3F0"/><text x="674" y="491" font-size="19" fill="#0F766E" font-weight="600">Великая Мать</text><rect x="924" y="462" width="184" height="42" rx="21" fill="#E4F3F0"/><text x="942" y="491" font-size="19" fill="#0F766E" font-weight="600">Анима / Анимус</text><line x1="656" y1="524" x2="1176" y2="524" stroke="#E2E8F0" stroke-width="2"/><text x="656" y="560" font-size="19" fill="#343A40"><tspan x="656" dy="0">Сказка, миф, игра, любимый герой —</tspan><tspan x="656" dy="30">встреча ребёнка с общечеловеческими образами.</tspan></text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Отсюда — ценность творчества и работы с символами в детском возрасте.</text></svg></div>

"294" r="7" fill="#0D6EFD"/><text x="724" y="300" font-size="21" fill="#212529" font-weight="700">Мышление</text><text x="724" y="328" font-size="19" fill="#6C757D">логика, структура, правила</text><circle cx="700" cy="366" r="7" fill="#0F766E"/><text x="724" y="372" font-size="21" fill="#212529" font-weight="700">Чувство</text><text x="724" y="400" font-size="19" fill="#6C757D">принятие, личное отношение</text><circle cx="700" cy="438" r="7" fill="#0D6EFD"/><text x="724" y="444" font-size="21" fill="#212529" font-weight="700">Ощущение</text><text x="724" y="472" font-size="19" fill="#6C757D">наглядность, практика</text><circle cx="700" cy="510" r="7" fill="#0F766E"/><text x="724" y="516" font-size="21" fill="#212529" font-weight="700">Интуиция</text><text x="724" y="544" font-size="19" fill="#6C757D">смысл, догадка, перспектива</text><text x="72" y="654" font-size="21" fill="#343A40" font-weight="600">Вывод: единый метод обучения не годится для всех — отсюда идея стилей обучения.</text></svg></div>

nt-size="20" fill="#343A40">учёт индивидуальных стилей обучения;</text><circle cx="693" cy="361" r="5" fill="#0F766E"/><text x="714" y="368" font-size="20" fill="#343A40">ценность творчества, сказки и игры;</text><circle cx="693" cy="417" r="5" fill="#0F766E"/><text x="714" y="424" font-size="20" fill="#343A40">работа с символами и внутренним миром;</text><circle cx="693" cy="473" r="5" fill="#0F766E"/><text x="714" y="480" font-size="20" fill="#343A40">внимание к личности учителя.</text><rect x="77" y="618" width="1136" height="68" rx="18" fill="#E9EEF3"/><rect x="72" y="612" width="1136" height="68" rx="18" fill="#F8F9FA" stroke="#F8F9FA" stroke-width="1.5"/><text x="104" y="656" font-size="21" fill="#212529" font-weight="600">Двойная опора учителя: понимание отношений и понимание внутреннего мира ребёнка.</text></svg></div>

<script>
var idx=0,slides=document.querySelectorAll('.slide'),n=slides.length;
var bar=document.getElementById('bar'),cur=document.getElementById('cur');
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720)*0.94;
  slides.forEach(function(el){el.style.transform='scale('+s+')';});}
function show(i){idx=Math.max(0,Math.min(n-1,i));
  slides.forEach(function(el,k){el.classList.toggle('active',k===idx);});
  bar.style.width=((idx+1)/n*100)+'%';cur.textContent=idx+1;
  try{history.replaceState(null,'','#'+(idx+1));}catch(e){}}
addEventListener('resize',fit);
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){
    show(idx+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(idx-1);e.preventDefault();}
  else if(e.key==='Home'){show(0);}
  else if(e.key==='End'){show(n-1);}
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement){document.exitFullscreen();}
    else{document.documentElement.requestFullscreen();}}});
document.addEventListener('click',function(e){
  if(e.target.closest('#hud')||e.target.closest('#help'))return;
  show(idx+(e.clientX<innerWidth*0.3?-1:1));});
fit();show((parseInt((location.hash||'#1').slice(1),10)||1)-1);
</script>
